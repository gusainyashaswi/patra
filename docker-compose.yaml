# Local development only: database ports are bound to loopback.
x-api: &api
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  env_file: ${PATRA_ENV_FILE:-.env}
  environment: &api-env
    NODE_ENV: development
    PORT: 5001
    MONGODB_URI: mongodb://mongo:27017/patra?replicaSet=rs0
    REDIS_URL: redis://redis:6379
    API_URL: http://localhost:5001
    CORS_ORIGIN: http://localhost:3000
    S3_ENDPOINT: http://minio:9000
    S3_REGION: us-east-1
    S3_BUCKET: patra-images
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-patra-local}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-patra-local-storage-password}
    S3_PUBLIC_URL: http://localhost:9000/patra-images
  depends_on:
    mongo-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok || quit(1)"]
      interval: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - >-
        mongosh --host mongo --quiet --eval 'try { rs.status() } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }';
        until mongosh --host mongo --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; do sleep 2; done
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  server:
    <<: *api
    ports: ["127.0.0.1:5001:5001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
  worker:
    <<: *api
    command: ["node", "apps/server/dist/worker.js"]
    stop_grace_period: 30s
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patra-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patra-local-storage-password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patra-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patra-local-storage-password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing local/patra-images && mc anonymous set download local/patra-images
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
volumes:
  mongo_data:
  redis_data:
  minio_data:
